# Local topology: 2 engine partitions (each exclusively owns the symbols that
# hash to its partition), a health sidecar per engine, Envoy as the gRPC
# front door, Prometheus + Grafana.
#
#   docker compose -f docker/docker-compose.yml up --build
#   me_client --target=localhost:8080 symbols        # via Envoy
#   me_loadtest --target=localhost:8080 --concurrency=8
#
# NOTE: Envoy round-robins across partitions; a request for a symbol owned by
# the other partition gets FAILED_PRECONDITION (WRONG_PARTITION). Symbol-aware
# routing is done with the header `x-me-partition: <n>` (see envoy/envoy.yaml),
# which me_loadtest/me_client do not set -- so for correctness-sensitive
# clients address a partition's own port (50051 / 50052) directly.
services:
  engine-0:
    build: { context: .., dockerfile: docker/Dockerfile.engine }
    image: matching-engine:local
    command: ["--shards=2", "--partition=0/2", "--metrics-port=9100"]
    environment:
      ME_SYMBOLS: AAPL,MSFT,GOOG,AMZN,TSLA,NVDA,META,BRK
    ports: ["50051:50051", "9100:9100"]
    stop_grace_period: 10s
    deploy: { resources: { limits: { cpus: "3", memory: 2g } } }
  engine-1:
    image: matching-engine:local
    depends_on: [engine-0]
    command: ["--shards=2", "--partition=1/2", "--metrics-port=9100"]
    environment:
      ME_SYMBOLS: AAPL,MSFT,GOOG,AMZN,TSLA,NVDA,META,BRK
    ports: ["50052:50051", "9101:9100"]
    stop_grace_period: 10s
    deploy: { resources: { limits: { cpus: "3", memory: 2g } } }
  sidecar-0:
    build: { context: .., dockerfile: docker/Dockerfile.sidecar }
    image: matching-engine-sidecar:local
    network_mode: "service:engine-0"
    environment: { ENGINE_METRICS_URL: "http://127.0.0.1:9100", ENGINE_GRPC_ADDR: "127.0.0.1:50051", SIDECAR_LISTEN: ":8081" }
  sidecar-1:
    image: matching-engine-sidecar:local
    network_mode: "service:engine-1"
    environment: { ENGINE_METRICS_URL: "http://127.0.0.1:9100", ENGINE_GRPC_ADDR: "127.0.0.1:50051", SIDECAR_LISTEN: ":8081" }
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    volumes: ["../envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["8080:8080", "9901:9901"]
    depends_on: [engine-0, engine-1]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:10.4.3
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/matching-engine.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
