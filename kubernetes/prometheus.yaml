apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: matching-engine }
data:
  prometheus.yml: |
    global: { scrape_interval: 5s }
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [matching-engine] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
          - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: "([^:]+)(?::\\d+)?;(\\d+)", replacement: "$1:$2", target_label: __address__ }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
          - { source_labels: [__meta_kubernetes_pod_label_app], target_label: app }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: matching-engine }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-me }
rules: [{ apiGroups: [""], resources: [pods], verbs: [get, list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-me }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-me }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: matching-engine }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: matching-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/prometheus }]
      volumes: [{ name: cfg, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: matching-engine }
spec: { selector: { app: prometheus }, ports: [{ port: 9090 }] }
